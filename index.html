<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Gmail Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === TEMA TERANG (DEFAULT) === */
        :root {
            --bg-color: #f3f4f6;
            --container-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* === TEMA GELAP === */
        body.dark-mode {
            --bg-color: #111827;
            --container-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --success: #34d399;
            --success-hover: #10b981;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --border: #374151;
            --input-bg: #111827;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .card {
            background-color: var(--container-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 520px;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; font-size: 24px; font-weight: 700; color: var(--primary); }
        .header p { margin: 5px 0 0; font-size: 14px; color: var(--text-muted); }

        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50px;
            transition: all 0.2s;
            color: var(--text-main);
        }
        .theme-toggle:hover { transform: scale(1.05); border-color: var(--primary); }

        .db-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            font-weight: 600;
        }
        .db-info span { color: var(--text-muted); }
        .db-info strong { color: var(--success); font-size: 15px; }
        .btn-reset {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-reset:hover { background: var(--danger-hover); }

        .form-group { margin-bottom: 20px; }
        /* Grid untuk merapikan input agar sejajar jika layar lebar */
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .input-box { flex: 1; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); }

        .button-group { display: flex; gap: 15px; margin-bottom: 20px; }
        button.btn-main {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-generate { background-color: var(--primary); }
        .btn-generate:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        
        .btn-download { background-color: var(--success); }
        .btn-download:hover:not(:disabled) { background-color: var(--success-hover); transform: translateY(-2px); }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .preview-area label { display: flex; justify-content: space-between; }
        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        textarea:focus { border-color: var(--primary); }

        .status-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <button class="theme-toggle" id="themeToggle" title="Ganti Tema">🌙</button>

    <div class="header">
        <h2>Gmail Generator PRO</h2>
        <p>Format: Nama + Teks + 3 Angka</p>
    </div>

    <!-- Info Database Lokal -->
    <div class="db-info">
        <div>
            <span>Tersimpan di Memori: </span>
            <strong id="savedCount">0</strong>
        </div>
        <button class="btn-reset" onclick="resetDatabase()">Reset</button>
    </div>
    
    <div class="input-row">
        <div class="input-box">
            <label for="amount">Jumlah Email:</label>
            <input type="number" id="amount" min="1" max="50000" value="10" placeholder="Misal: 5000">
        </div>
        <div class="input-box">
            <label for="customText">Teks Tambahan (Opsional):</label>
            <input type="text" id="customText" value="knv" placeholder="Kosongkan jika tidak ada">
        </div>
    </div>
    
    <div class="button-group">
        <button class="btn-main btn-generate" id="generateBtn" onclick="generateEmails()">
            ⚡ Buat Email
        </button>
        <button class="btn-main btn-download" id="downloadBtn" onclick="downloadTxt()" disabled>
            💾 Simpan .TXT
        </button>
    </div>
    
    <div class="preview-area">
        <label>
            <span>Hasil Preview (Max 100)</span>
        </label>
        <textarea id="preview" readonly placeholder="Email akan muncul di sini..."></textarea>
        <div class="status-text" id="statusText">Menunggu perintah...</div>
    </div>
</div>

<script>
    // --- FITUR DARK MODE ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const body = document.body;
    
    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        themeToggleBtn.innerText = '☀️';
    }

    themeToggleBtn.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
            themeToggleBtn.innerText = '☀️';
        } else {
            localStorage.setItem('theme', 'light');
            themeToggleBtn.innerText = '🌙';
        }
    });

    // --- DATA NAMA MANUSIA ---
    const firstNames = [
        "andi", "budi", "citra", "dani", "eko", "fajar", "gilang", "hasan", "intan", "joko",
        "kiki", "lia", "mega", "nova", "opan", "putri", "qori", "raka", "siti", "trio",
        "umar", "vina", "wahyu", "yanto", "zaki", "alex", "ben", "chris", "david",
        "evan", "frank", "george", "harry", "ivan", "john", "kevin", "luke", "mike",
        "oliver", "peter", "ryan", "sam", "tom", "victor", "will", "ayu",
        "bela", "cindy", "diana", "elisa", "fani", "gina", "hana", "irma", "julia", "kara",
        "lina", "mia", "nina", "olivia", "puji", "ratna", "sari", "tina", "ulan", "vera", "winda", "yeni"
    ];

    const lastNames = [
        "saputra", "wijaya", "pratama", "kurniawan", "setiawan", "hidayat", "santoso", "gunawan",
        "wibowo", "purnomo", "kusuma", "pangestu", "fauzi", "putra", "nugroho", "prasetyo",
        "susanto", "ramadhan", "akbar", "mahendra", "smith", "johnson", "williams", "brown",
        "jones", "garcia", "miller", "davis", "rodriguez", "martinez", "hernandez", "lopez",
        "gonzalez", "wilson", "anderson", "thomas", "taylor", "moore", "jackson", "martin",
        "lee", "perez", "thompson", "white", "harris", "sanchez", "clark", "ramirez"
    ];

    // --- DATABASE MEMORI ---
    let savedEmailsDB = new Set(JSON.parse(localStorage.getItem('generatedHistory') || '[]'));
    let tempEmailArray = []; 

    function updateDBCount() {
        document.getElementById('savedCount').innerText = savedEmailsDB.size.toLocaleString('id-ID');
    }
    updateDBCount(); 

    function resetDatabase() {
        if(confirm("Yakin ingin mereset memori? Email yang sudah pernah dibuat bisa ter-generate lagi nantinya.")) {
            savedEmailsDB.clear();
            localStorage.setItem('generatedHistory', '[]');
            updateDBCount();
            alert("Database memori berhasil direset!");
        }
    }

    // --- FUNGSI GENERATOR ---
    function generateEmails() {
        const amount = parseInt(document.getElementById('amount').value);
        // Ambil nilai dari input custom, lalu bersihkan dari karakter aneh dan spasi, jadikan huruf kecil semua
        let customTextRaw = document.getElementById('customText').value;
        const customText = customTextRaw.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const preview = document.getElementById('preview');
        const statusText = document.getElementById('statusText');

        if (isNaN(amount) || amount <= 0) {
            alert('Masukkan jumlah yang valid!');
            return;
        }

        generateBtn.disabled = true;
        downloadBtn.disabled = true;
        statusText.innerText = `Membuat ${amount} email dan mengecek duplikat...`;
        preview.value = "";
        
        tempEmailArray = []; 
        let currentSessionSet = new Set(); 

        setTimeout(() => {
            let previewText = "";
            let failedToGenerate = 0;

            for (let i = 0; i < amount; i++) {
                let fullEmail = "";
                let isUnique = false;
                let safetyLoop = 0;

                while (!isUnique && safetyLoop < 1000) {
                    let fName = firstNames[Math.floor(Math.random() * firstNames.length)];
                    let lName = lastNames[Math.floor(Math.random() * lastNames.length)];
                    
                    let randomNumber = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                    
                    // Format baru menggunakan customText yang sudah dibersihkan
                    fullEmail = `${fName}${lName}${customText}${randomNumber}@gmail.com`;

                    if (!savedEmailsDB.has(fullEmail) && !currentSessionSet.has(fullEmail)) {
                        isUnique = true;
                    }
                    safetyLoop++;
                }

                if (isUnique) {
                    tempEmailArray.push(fullEmail);
                    currentSessionSet.add(fullEmail);

                    if (tempEmailArray.length <= 100) {
                        previewText += fullEmail + "\n";
                    }
                } else {
                    failedToGenerate++;
                }
            }

            preview.value = previewText;
            if (tempEmailArray.length > 100) {
                preview.value += `\n... dan ${tempEmailArray.length - 100} email lainnya (Klik Simpan)`;
            }

            if (failedToGenerate > 0) {
                statusText.innerText = `Berhasil ${tempEmailArray.length} email. (Gagal ${failedToGenerate} - silakan Reset memori!)`;
            } else {
                statusText.innerText = `Berhasil membuat ${tempEmailArray.length} email! Siap disimpan.`;
            }

            generateBtn.disabled = false;
            if (tempEmailArray.length > 0) {
                downloadBtn.disabled = false;
            }
        }, 100);
    }

    // --- FUNGSI DOWNLOAD ---
    function downloadTxt() {
        if (tempEmailArray.length === 0) return;

        const amount = tempEmailArray.length;
        
        // Ambil nama custom text untuk dijadikan nama file saat di-download
        let customTextRaw = document.getElementById('customText').value;
        let fileNameTag = customTextRaw.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        if(fileNameTag === "") fileNameTag = "POLOS"; // Jika teks tambahan dikosongkan
        
        const blob = new Blob([tempEmailArray.join("\n")], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        
        // Nama file menyesuaikan custom teks yang dipakai (cth: Email_KNV_1000.txt atau Email_POLOS_1000.txt)
        a.download = `Email_${fileNameTag}_${amount}.txt`;
        
        document.body.appendChild(a);
        a.click(); 
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        tempEmailArray.forEach(email => savedEmailsDB.add(email));
        
        try {
            localStorage.setItem('generatedHistory', JSON.stringify([...savedEmailsDB]));
        } catch (e) {
            alert("Peringatan: Memori browser hampir penuh. Silakan klik tombol 'Reset' database.");
        }

        updateDBCount();
        document.getElementById('statusText').innerText = `File berhasil diunduh dan diamankan ke database!`;
        document.getElementById('downloadBtn').disabled = true; 
    }
</script>

</body>
</html>
